name: UI/UX & Code Quality Automated Audit

# 워크플로우가 언제 실행될지 정의
on:
  push:
    branches: [ "main", "develop" ] # main, develop 브랜치에 코드가 푸시될 때
  pull_request:
    branches: [ "main" ]            # main 브랜치로 PR을 보낼 때

jobs:
  audit:
    runs-on: ubuntu-latest # GitHub이 제공하는 최신 리눅스 환경에서 실행

    steps:
    # 저장소의 코드를 가상 환경으로 가져오기
    - name: Check out repository
      uses: actions/checkout@v4

    # 파이썬 환경을 세팅
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 프로젝트에 맞는 파이썬 버전으로 설정
        cache: 'pip'           # 패키지 설치 속도 향상을 위한 캐싱

    # 필요한 파이썬 패키지 및 Playwright 브라우저를 설치
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    # 자동화 CLI 스크립트를 실행하여 사이트를 검수
    - name: Run Automated Audit CLI
      env:
        # GitHub Secrets에 등록한 Gemini API 키를 환경 변수로 주입
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # 검사할 타겟 URL과 실패 커트라인(Threshold)을 지정
        python cli.py --url "https://example.com" --threshold 75 --output "audit_report.json"

    # 검수 결과 JSON 파일을 GitHub 아티팩트(Artifact)로 저장하여 다운로드할 수 있게 합니다.
    - name: Upload Audit Artifact (Report)
      if: always() # 앞선 단계가 실패하더라도 리포트는 무조건 저장되도록 설정
      uses: actions/upload-artifact@v4
      with:
        name: ui-ux-audit-report
        path: audit_report.json
        retention-days: 14 # 리포트 보관 기간